<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0F1E"/>
      <stop offset="50%" style="stop-color:#0F172A"/>
      <stop offset="100%" style="stop-color:#0A0F1E"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0A0F1E;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#3B82F6;stop-opacity:1"/>
      <stop offset="70%" style="stop-color:#60A5FA;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0A0F1E;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F1F5F9"/>
      <stop offset="50%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#94A3B8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="subtleGlow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" fill="url(#bg)" rx="8"/>

  <!-- Grid lines - subtle -->
  <g opacity="0.04" stroke="#60A5FA" stroke-width="0.5">
    <line x1="0" y1="40" x2="900" y2="40"/>
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="150" y1="0" x2="150" y2="200"/>
    <line x1="300" y1="0" x2="300" y2="200"/>
    <line x1="450" y1="0" x2="450" y2="200"/>
    <line x1="600" y1="0" x2="600" y2="200"/>
    <line x1="750" y1="0" x2="750" y2="200"/>
  </g>

  <!-- Dot grid accent top-right -->
  <g opacity="0.08" fill="#60A5FA">
    <circle cx="720" cy="30" r="1.5"/>
    <circle cx="740" cy="30" r="1.5"/>
    <circle cx="760" cy="30" r="1.5"/>
    <circle cx="780" cy="30" r="1.5"/>
    <circle cx="800" cy="30" r="1.5"/>
    <circle cx="820" cy="30" r="1.5"/>
    <circle cx="840" cy="30" r="1.5"/>
    <circle cx="860" cy="30" r="1.5"/>
    <circle cx="880" cy="30" r="1.5"/>
    <circle cx="720" cy="50" r="1.5"/>
    <circle cx="740" cy="50" r="1.5"/>
    <circle cx="760" cy="50" r="1.5"/>
    <circle cx="780" cy="50" r="1.5"/>
    <circle cx="800" cy="50" r="1.5"/>
    <circle cx="820" cy="50" r="1.5"/>
    <circle cx="840" cy="50" r="1.5"/>
    <circle cx="860" cy="50" r="1.5"/>
    <circle cx="880" cy="50" r="1.5"/>
    <circle cx="720" cy="70" r="1.5"/>
    <circle cx="740" cy="70" r="1.5"/>
    <circle cx="760" cy="70" r="1.5"/>
    <circle cx="780" cy="70" r="1.5"/>
    <circle cx="800" cy="70" r="1.5"/>
    <circle cx="820" cy="70" r="1.5"/>
    <circle cx="840" cy="70" r="1.5"/>
    <circle cx="860" cy="70" r="1.5"/>
    <circle cx="880" cy="70" r="1.5"/>
  </g>

  <!-- Dot grid accent bottom-left -->
  <g opacity="0.08" fill="#3B82F6">
    <circle cx="20" cy="130" r="1.5"/>
    <circle cx="40" cy="130" r="1.5"/>
    <circle cx="60" cy="130" r="1.5"/>
    <circle cx="80" cy="130" r="1.5"/>
    <circle cx="100" cy="130" r="1.5"/>
    <circle cx="120" cy="130" r="1.5"/>
    <circle cx="140" cy="130" r="1.5"/>
    <circle cx="20" cy="150" r="1.5"/>
    <circle cx="40" cy="150" r="1.5"/>
    <circle cx="60" cy="150" r="1.5"/>
    <circle cx="80" cy="150" r="1.5"/>
    <circle cx="100" cy="150" r="1.5"/>
    <circle cx="120" cy="150" r="1.5"/>
    <circle cx="140" cy="150" r="1.5"/>
    <circle cx="20" cy="170" r="1.5"/>
    <circle cx="40" cy="170" r="1.5"/>
    <circle cx="60" cy="170" r="1.5"/>
    <circle cx="80" cy="170" r="1.5"/>
    <circle cx="100" cy="170" r="1.5"/>
    <circle cx="120" cy="170" r="1.5"/>
    <circle cx="140" cy="170" r="1.5"/>
  </g>

  <!-- Blue glow orb left -->
  <ellipse cx="120" cy="100" rx="80" ry="60" fill="#1D4ED8" opacity="0.08"/>

  <!-- Blue glow orb right -->
  <ellipse cx="780" cy="100" rx="80" ry="60" fill="#3B82F6" opacity="0.06"/>

  <!-- Accent line top -->
  <rect x="0" y="0" width="900" height="2" fill="url(#lineGrad)" rx="1"/>

  <!-- Accent line bottom -->
  <rect x="0" y="198" width="900" height="2" fill="url(#lineGrad)" rx="1"/>

  <!-- Name -->
  <text x="450" y="95"
    font-family="'Segoe UI', Inter, Arial, sans-serif"
    font-size="48"
    font-weight="700"
    fill="url(#nameGrad)"
    text-anchor="middle"
    filter="url(#subtleGlow)"
    letter-spacing="-1">Ali Sajjad</text>

  <!-- Divider line under name -->
  <line x1="350" y1="108" x2="550" y2="108" stroke="#3B82F6" stroke-width="1" opacity="0.4"/>

  <!-- Role -->
  <text x="450" y="135"
    font-family="'Segoe UI', Inter, Arial, sans-serif"
    font-size="16"
    font-weight="400"
    fill="#60A5FA"
    text-anchor="middle"
    letter-spacing="2">BACKEND ENGINEER · AI DEVELOPER</text>

  <!-- Location -->
  <text x="450" y="165"
    font-family="'Segoe UI', Inter, Arial, sans-serif"
    font-size="12"
    fill="#475569"
    text-anchor="middle"
    letter-spacing="1">ISLAMABAD, PAKISTAN · FAST-NUCES · GRADUATING JUNE 2027</text>

</svg>
